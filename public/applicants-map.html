<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDC 지원자 분포 지도</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: #1e293b;
}

.top-banner {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 3px solid #1e3a8a;
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.top-banner img { height: 52px; width: auto; object-fit: contain; }
.banner-text h1 { font-size: 19px; font-weight: 800; color: #1e3a8a; }
.banner-text p  { font-size: 12px; color: #64748b; margin-top: 1px; }
.banner-right { margin-left: auto; }
.back-link {
  font-size: 12px; color: #1e3a8a; text-decoration: none; font-weight: 700;
  border: 1px solid #1e3a8a; border-radius: 20px; padding: 6px 14px;
}
.back-link:hover { background: #eff6ff; }

nav {
  flex-shrink: 0;
  height: 44px;
  background: #1e3a8a;
  display: flex;
  align-items: stretch;
  padding: 0 16px;
  gap: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.nav-btn {
  background: none; border: none; color: rgba(255,255,255,.7);
  padding: 0 20px; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer;
  display: flex; align-items: center;
  position: relative;
  transition: color .15s;
}
.nav-btn:hover { color: #fff; }
.nav-btn.active { color: #fff; }
.nav-btn.active::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 3px;
  background: #93c5fd; border-radius: 2px 2px 0 0;
}
.nav-right { margin-left: auto; color: rgba(255,255,255,.6); font-size: 12px; display: flex; align-items: center; }

main {
  flex: 1;
  min-height: 0;
  display: flex;
  background: #f1f5f9;
}

.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: white;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 14px;
  gap: 12px;
}

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card {
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
  padding: 10px 12px;
}
.stat-num { font-size: 20px; font-weight: 800; color: #1e3a8a; }
.stat-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }

.legend-box {
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px;
}
.legend-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; }
.li { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12px; color: #475569; }
.ld { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,.15); }
.ld-half { position: relative; overflow: hidden; }
.ld-half::after { content:''; position:absolute; top:0; right:0; bottom:0; width:50%; background:var(--r); }
.lsq { width: 8px; height: 8px; flex-shrink: 0; border-radius: 2px; }
.size-row { display:flex; align-items:center; gap:10px; margin-top:4px; }
.size-dot { border-radius: 50%; background: #2563eb; flex-shrink:0; }

.other-box {
  background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px 12px;
}
.other-title { font-size: 12px; font-weight: 700; color: #9a3412; margin-bottom: 4px; }
.other-num { font-size: 22px; font-weight: 800; color: #ea580c; }
.other-sub { font-size: 11px; color: #9a3412; margin-top: 2px; }
.other-list { margin-top: 8px; max-height: 160px; overflow-y: auto; }
.other-row { font-size: 11px; color: #78350f; padding: 2px 0; display:flex; justify-content:space-between; gap:6px; }

.tabs { display: flex; gap: 4px; }
.tabbtn {
  flex: 1; padding: 7px 4px; border: 1px solid #e2e8f0; background: white;
  border-radius: 6px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; font-family: inherit;
}
.tabbtn.on { background: #1e3a8a; color: white; border-color: #1e3a8a; }

.map-area { flex: 1; min-width: 0; position: relative; }
#map { position: absolute; top:0; right:0; bottom:0; left:0; }

.ipop {
  background: white; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  padding: 12px 14px 10px; min-width: 210px; max-width: 280px;
  font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
}
.it { font-size: 14px; font-weight: 800; color: #1e3a8a; margin-bottom: 6px; }
.ir { display:flex; gap:5px; margin-bottom:3px; font-size:11.5px; color:#64748b; }
.idv { height:1px; background:#f1f5f9; margin:7px 0; }
.icl { display:block; width:100%; margin-top:7px; padding-top:6px; border-top:1px solid #f1f5f9; background:none; border-left:none;border-right:none;border-bottom:none; font-size:11px; color:#94a3b8; cursor:pointer; text-align:right; font-family:inherit; }
</style>
</head>
<body>

<div class="top-banner">
  <img src="/logo.jpg" alt="로고" onerror="this.style.display='none'">
  <div class="banner-text">
    <h1>SDC 지원자 분포 지도</h1>
    <p>서울디지털콘텐츠고등학교 · 학교별 지원자 분포 및 지하철 접근성</p>
  </div>
  <div class="banner-right">
    <a class="back-link" href="/">← 학교 방문 관리로</a>
  </div>
</div>

<nav>
  <div class="tabs" style="flex:1; max-width:360px; align-items:center; display:flex; gap:2px;">
    <button class="nav-btn active" id="tab-all"    onclick="setField('all')">전체</button>
    <button class="nav-btn"        id="tab-eng"    onclick="setField('eng')">🔧 공학부문</button>
    <button class="nav-btn"        id="tab-design" onclick="setField('design')">🎨 디자인부문</button>
  </div>
  <div class="nav-right" id="nav-updated"></div>
</nav>

<main>
  <div class="sidebar">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" id="s-total">-</div><div class="stat-lbl">지원 학생 수</div></div>
      <div class="stat-card"><div class="stat-num" id="s-schools">-</div><div class="stat-lbl">지원 학교 수</div></div>
      <div class="stat-card"><div class="stat-num" id="s-mapped">-</div><div class="stat-lbl">지도 표시 학교</div></div>
      <div class="stat-card"><div class="stat-num" id="s-near">-</div><div class="stat-lbl">5·9호선 인접 학교</div></div>
    </div>

    <div class="legend-box">
      <div class="legend-title">🚇 지하철 라인 접근성 (학교 표시 색)</div>
      <div class="li"><span class="ld" style="background:#AA9872"></span>9호선 인접 (800m 이내)</div>
      <div class="li"><span class="ld" style="background:#996CAC"></span>5호선 인접 (800m 이내)</div>
      <div class="li"><span class="ld ld-half" style="background:#AA9872; --r:#996CAC"></span>9·5호선 모두 인접</div>
      <div class="li"><span class="ld" style="background:#2563eb"></span>그 외 (도보 접근성 낮음)</div>
      <div class="li"><span class="ld" style="background:#dc2626; border-radius:3px"></span>서울디지털콘텐츠고 (우리 학교)</div>
      <div class="idv" style="margin:8px 0"></div>
      <div class="li"><span class="lsq" style="background:#AA9872"></span>9호선 역</div>
      <div class="li"><span class="lsq" style="background:#996CAC"></span>5호선 역</div>
      <div class="idv" style="margin:8px 0"></div>
      <div style="font-size:11px; color:#94a3b8; margin-bottom:2px">원 크기 = 지원자 수 (해당 부문 기준)</div>
      <div class="size-row">
        <div class="size-dot" style="width:10px;height:10px"></div>
        <div class="size-dot" style="width:20px;height:20px"></div>
        <div class="size-dot" style="width:32px;height:32px"></div>
        <span style="font-size:10px;color:#94a3b8;margin-left:auto">1명 → 다수</span>
      </div>
    </div>

    <div class="other-box">
      <div class="other-title">🗺️ 지도 밖 · 지방 지원자</div>
      <div class="other-num" id="o-num">-</div>
      <div class="other-sub" id="o-sub">서울/수도권 밖이라 지도에 표시되지 않음</div>
      <div class="other-list" id="o-list"></div>
    </div>
  </div>

  <div class="map-area">
    <div id="map"></div>
  </div>
</main>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=220b3c4d0d3d7a0339d6a608e494a10a"></script>
<script>
let map, data, field = 'all', openOv = null;
const LINE9_COLOR = '#AA9872', LINE5_COLOR = '#996CAC', DEFAULT_COLOR = '#2563eb', OUR_COLOR = '#dc2626';
let schoolMarkers = [], stationMarkers = [], ourMarker = null;

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function countFor(s){ return field==='eng' ? s.eng : field==='design' ? s.design : s.total; }

async function init() {
  data = await fetch('/data/applicant_distribution.json').then(r => r.json());
  document.getElementById('nav-updated').textContent = '집계 기준: 참가 신청서';
  renderStats();
  try {
    if (typeof kakao === 'undefined') throw new Error('카카오맵 SDK 로드 실패 (도메인 미등록 등)');
    initMap();
    renderStationMarkers();
    renderSchoolMarkers();
  } catch (e) {
    console.error(e);
    document.getElementById('map').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px;text-align:center;padding:20px">지도를 불러오지 못했습니다.<br>${esc(e.message)}</div>`;
  }
}

function initMap() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(data.ourSchool.lat, data.ourSchool.lng),
    level: 9
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30">
    <path d="M11 0C4.9 0 0 4.9 0 11c0 8 11 19 11 19s11-11 11-19C22 4.9 17.1 0 11 0z" fill="${OUR_COLOR}" stroke="white" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="4.5" fill="white"/>
  </svg>`;
  ourMarker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(data.ourSchool.lat, data.ourSchool.lng),
    image: new kakao.maps.MarkerImage('data:image/svg+xml,' + encodeURIComponent(svg), new kakao.maps.Size(22,30), { offset: new kakao.maps.Point(11,30) }),
    zIndex: 20, title: data.ourSchool.name
  });
  ourMarker.setMap(map);

  const label = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(data.ourSchool.lat, data.ourSchool.lng),
    content: `<div style="background:${OUR_COLOR};color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;transform:translateY(6px)">🏫 ${esc(data.ourSchool.name)}</div>`,
    yAnchor: 2.4, zIndex: 20
  });
  label.setMap(map);

  kakao.maps.event.addListener(map, 'click', closeInfo);
}

function stationDotImg(lines) {
  const size = 9;
  let svg;
  if (lines.length === 2) {
    svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
      <path d="M${size/2} 0 A${size/2} ${size/2} 0 0 1 ${size/2} ${size}Z" fill="${LINE9_COLOR}"/>
      <path d="M${size/2} 0 A${size/2} ${size/2} 0 0 0 ${size/2} ${size}Z" fill="${LINE5_COLOR}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="none" stroke="white" stroke-width="1"/>
    </svg>`;
  } else {
    const c = lines[0] === 9 ? LINE9_COLOR : LINE5_COLOR;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
      <rect width="${size}" height="${size}" rx="2" fill="${c}" stroke="white" stroke-width="1"/>
    </svg>`;
  }
  return new kakao.maps.MarkerImage('data:image/svg+xml,' + encodeURIComponent(svg), new kakao.maps.Size(size,size), { offset: new kakao.maps.Point(size/2,size/2) });
}

function renderStationMarkers() {
  data.stations.forEach(st => {
    const m = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(st.lat, st.lng),
      image: stationDotImg(st.lines), zIndex: 3, title: st.name + '역'
    });
    m.setMap(map);
    stationMarkers.push(m);
  });
}

function schoolColor(s) {
  if (s.near5 && s.near9) return null; // dual, handled separately
  if (s.near9) return LINE9_COLOR;
  if (s.near5) return LINE5_COLOR;
  return DEFAULT_COLOR;
}

function schoolMarkerImg(s, count) {
  const r = Math.max(7, Math.min(26, 6 + Math.sqrt(count) * 6));
  const d = r * 2;
  const dual = s.near5 && s.near9;
  let inner;
  if (dual) {
    inner = `<path d="M${r} 0 A${r} ${r} 0 0 1 ${r} ${d}Z" fill="${LINE9_COLOR}"/>
              <path d="M${r} 0 A${r} ${r} 0 0 0 ${r} ${d}Z" fill="${LINE5_COLOR}"/>`;
  } else {
    inner = `<circle cx="${r}" cy="${r}" r="${r-1.5}" fill="${schoolColor(s)}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${d}" height="${d}">
    ${inner}
    <circle cx="${r}" cy="${r}" r="${r-1}" fill="none" stroke="white" stroke-width="1.5"/>
  </svg>`;
  return { img: new kakao.maps.MarkerImage('data:image/svg+xml,' + encodeURIComponent(svg), new kakao.maps.Size(d,d), { offset: new kakao.maps.Point(r,r) }), r };
}

function renderSchoolMarkers() {
  if (!map) return;
  schoolMarkers.forEach(m => m.setMap(null));
  schoolMarkers = [];
  data.schools.forEach(s => {
    const count = countFor(s);
    if (!count) return;
    const { img } = schoolMarkerImg(s, count);
    const m = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(s.lat, s.lng), image: img, zIndex: 10, title: s.name
    });
    kakao.maps.event.addListener(m, 'click', () => showInfo(s));
    m.setMap(map);
    schoolMarkers.push(m);
  });
}

function showInfo(s) {
  closeInfo();
  const box = document.createElement('div');
  box.className = 'ipop';
  const lineTag = (s.near5 && s.near9) ? '🚇 9호선·5호선 인접'
    : s.near9 ? '🚇 9호선 인접' : s.near5 ? '🚇 5호선 인접' : '';
  box.innerHTML = `
    <div class="it">${esc(s.name)}</div>
    <div class="ir">📍 ${esc(s.address || s.region)}</div>
    <div class="ir">🔧 공학 ${s.eng}명 · 🎨 디자인 ${s.design}명 · 합계 ${s.total}명</div>
    ${lineTag ? `<div class="ir">${lineTag}</div>` : ''}
    <div class="ir" style="color:#94a3b8">${s.station9 ? `${esc(s.station9)}역(9) ${(s.dist9/1000).toFixed(1)}km` : ''} ${s.station5 ? `· ${esc(s.station5)}역(5) ${(s.dist5/1000).toFixed(1)}km` : ''}</div>
    <button class="icl" id="icl">닫기 ✕</button>
  `;
  box.querySelector('#icl').addEventListener('click', e => { e.stopPropagation(); closeInfo(); });
  openOv = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(s.lat, s.lng), content: box, yAnchor: 1.15, zIndex: 30 });
  openOv.setMap(map);
  map.panTo(new kakao.maps.LatLng(s.lat, s.lng));
}
function closeInfo() { if (openOv) { openOv.setMap(null); openOv = null; } }

function renderStats() {
  const m = data.meta;
  const total = field==='eng' ? m.engTotal : field==='design' ? m.designTotal : m.totalStudents;
  const schoolsShown = data.schools.filter(s => countFor(s) > 0);
  const nearCount = schoolsShown.filter(s => s.near5 || s.near9).length;
  document.getElementById('s-total').textContent = total.toLocaleString();
  document.getElementById('s-schools').textContent =
    (field==='eng' ? data.schools.filter(s=>s.eng>0).length + data.otherRegion.filter(s=>s.eng>0).length
     : field==='design' ? data.schools.filter(s=>s.design>0).length + data.otherRegion.filter(s=>s.design>0).length
     : m.totalSchools).toLocaleString();
  document.getElementById('s-mapped').textContent = schoolsShown.length.toLocaleString();
  document.getElementById('s-near').textContent = nearCount.toLocaleString();

  const other = data.otherRegion.filter(s => countFor(s) > 0);
  const otherTotal = other.reduce((a,s)=>a+countFor(s),0);
  document.getElementById('o-num').textContent = otherTotal.toLocaleString() + '명';
  document.getElementById('o-sub').textContent = `${other.length}개교 · 서울/수도권 밖`;
  const list = document.getElementById('o-list');
  list.innerHTML = other.sort((a,b)=>countFor(b)-countFor(a))
    .map(s => `<div class="other-row"><span>${esc(s.school)} <span style="color:#c2724a">(${esc(s.region)})</span></span><span>${countFor(s)}명</span></div>`)
    .join('') || '<div class="other-row" style="color:#c2724a">없음</div>';
}

function setField(f) {
  field = f;
  document.getElementById('tab-all').classList.toggle('active', f==='all');
  document.getElementById('tab-eng').classList.toggle('active', f==='eng');
  document.getElementById('tab-design').classList.toggle('active', f==='design');
  renderSchoolMarkers();
  renderStats();
}

init();
</script>
</body>
</html>
